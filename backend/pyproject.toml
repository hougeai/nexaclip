[project]
name = "nexaclip"
version = "0.1.0"
description = "NexaClip 后端：FastAPI + yt-dlp + FFmpeg，成品本地永久存储"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.35.0",
    "pydantic[email]>=2.9,<3",  # f2 锁 pydantic==2.9.*，故放宽区间（f2 实测 2.12 兼容）
    "pydantic-settings==2.7.1",
    "python-dotenv==1.2.1",
    "tortoise-orm[asyncpg]==0.23.0",  # asyncpg：TORTOISE_ORM 声明了 postgres 连接，启动会 import 其引擎，必须装
    "aiosqlite==0.20.0",
    "aerich==0.8.1",
    "nanoid>=2.0.0",
    "passlib==1.7.4",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "yt-dlp",
    "f2>=0.0.1.7",
    "loguru>=0.7.0",  # f2 代码 import loguru 但依赖声明缺失，显式补上
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.9",
    "apscheduler>=3.11.0",
]


[tool.ruff]
line-length = 120
lint.extend-select = []
lint.ignore = [
    "F403",
    "F405",
]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.aerich]
tortoise_orm = "core.config.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./app"
