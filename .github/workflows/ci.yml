name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv 从 v8 起不再发布 major 浮动标签（最新裸标签只到 v7），必须钉完整版本
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff@0.8.0 check app
      - name: Format check
        run: uvx ruff@0.8.0 format --check app

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # 版本号取自 frontend/package.json 的 packageManager（仓库根没有 package.json，
      # 且 defaults.run.working-directory 不影响 uses: 步骤，必须显式指定路径）
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint .
      - name: Build
        run: pnpm build
